name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@07d0b0e993009eb3b908ea06e49e88e933b728a2 # v1.17.0
        with:
          node-version: "24"
          cache: true

      - run: vp install --frozen-lockfile

      # Format, lint and type check the whole workspace in one pass.
      - run: vp check

      # `vp run -r` walks the workspace dependency graph, so @capuchoo/core is
      # built before @capuchoo/updater, which is built before the apps.
      - run: vp run -r build

      - run: vp run -r test

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger the server deploy only after checks pass
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then echo "RENDER_DEPLOY_HOOK is not set; skipping"; exit 0; fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
      - name: Trigger the dashboard deploy only after checks pass
        env:
          RENDER_DASHBOARD_DEPLOY_HOOK: ${{ secrets.RENDER_DASHBOARD_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DASHBOARD_DEPLOY_HOOK" ]; then echo "RENDER_DASHBOARD_DEPLOY_HOOK is not set; skipping"; exit 0; fi
          curl --fail --silent --show-error -X POST "$RENDER_DASHBOARD_DEPLOY_HOOK"
