# Builds packages/android/capuchoo for JitPack when a tag like android-v0.1.0 is requested:
#   implementation("com.github.aybinv7.capuchoo:capuchoo-android:android-v0.1.0")
jdk:
  - openjdk17
install:
  - cd packages/android && chmod +x gradlew && ./gradlew :capuchoo:publishReleasePublicationToMavenLocal -Pversion=$VERSION --no-daemon
