databases:
  - name: capuchoo-db
    plan: free
    region: frankfurt
    databaseName: capuchoo
    user: capuchoo
    postgresMajorVersion: "17"

services:
  - type: web
    name: capuchoo-server
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter "{services/server}..." run build &&
      pnpm --filter "{apps/dashboard}..." run build
    startCommand: pnpm --filter "{services/server}" run start
    healthCheckPath: /ready
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: capuchoo-db
          property: connectionString
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_DRIVER
        value: postgres
      - key: DASHBOARD_DIR
        value: ../../apps/dashboard/dist
      - key: TRUST_PROXY
        value: "true"
      - key: PUBLIC_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
