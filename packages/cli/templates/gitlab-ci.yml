# Generated by `capuchoo ci init --gitlab`. A push to a release branch publishes an OTA bundle to
# the channel of that environment, a merge request rehearses the same deploy without uploading,
# and prod is delivered to each client channel by hand, from the artefact prod already holds.
#
#   default branch, or a tag   -> prod
#   $CAPUCHOO_STAGING_BRANCH   -> staging
#   $CAPUCHOO_DEV_BRANCH       -> dev
#
# A native APK is built only when asked for, by starting the manual publish:native job, so a
# web-only change never waits for Gradle.
#
# Settings > CI/CD > Variables, every one Protected, and the three branches protected so they see
# them. A merge request rehearsal runs only where CAPUCHOO_API_KEY is visible to it.
#   CAPUCHOO_ENDPOINT          backend base URL
#   CAPUCHOO_API_KEY           API key scoped to this app                         Masked
#   CAPUCHOO_SIGNING_KEY       base64 PKCS#8 body of .capuchoo/signing-key.pem   Masked (optional)
#   ANDROID_KEYSTORE_BASE64    File variable: the release keystore, base64       Masked (native only)
#   ANDROID_KEYSTORE_PASSWORD  ANDROID_KEY_ALIAS  ANDROID_KEY_PASSWORD           Masked (native only)
#
# The keystore values are written to android/local.properties as RELEASE_STORE_FILE,
# RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD, and exported as
# CAPUCHOO_KEYSTORE_*; rename them to whatever your signingConfig reads.

stages:
  - check
  - publish
  - deliver

variables:
  APP_DIR: "."
  CAPUCHOO_CLI_VERSION: "__CAPUCHOO_CLI_VERSION__"
  CAPUCHOO_DEV_BRANCH: "dev"
  CAPUCHOO_STAGING_BRANCH: "staging"
  NODE_IMAGE: "node:22-bookworm"
  NODE_VERSION: "22.20.0"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_CMDLINE_TOOLS: "11076708"

.release-branches: &release-branches
  - if: $CI_COMMIT_TAG
    variables: { CAPUCHOO_CHANNEL: "prod" }
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    variables: { CAPUCHOO_CHANNEL: "prod" }
  - if: $CI_COMMIT_BRANCH == $CAPUCHOO_STAGING_BRANCH
    variables: { CAPUCHOO_CHANNEL: "staging" }
  - if: $CI_COMMIT_BRANCH == $CAPUCHOO_DEV_BRANCH
    variables: { CAPUCHOO_CHANNEL: "dev" }

# Installs with whatever the lockfile says, at the version package.json pins, then puts the
# project's own capuchoo on PATH.
.install: &install
  - |
    PM_VERSION=$(node -p "const p = require('./package.json'); (p.packageManager || '').split('@')[1]?.split('+')[0] || p.devEngines?.packageManager?.version || 'latest'")
    if [ -f pnpm-lock.yaml ]; then
      npm install -g --silent "pnpm@$PM_VERSION"
      pnpm config set store-dir "$CI_PROJECT_DIR/.cache/pnpm-store"
      pnpm install --frozen-lockfile
    elif [ -f yarn.lock ]; then
      corepack enable
      yarn install --immutable
    elif [ -f bun.lock ] || [ -f bun.lockb ]; then
      npm install -g --silent bun
      bun install --frozen-lockfile
    else
      npm ci --cache "$CI_PROJECT_DIR/.cache/npm"
    fi
  - export PATH="$CI_PROJECT_DIR/$APP_DIR/node_modules/.bin:$CI_PROJECT_DIR/node_modules/.bin:$PATH"

# Node only: an OTA deploy builds the web app and syncs Capacitor, and needs no Android SDK.
.web:
  image: $NODE_IMAGE
  cache:
    key: capuchoo-web-$NODE_IMAGE
    paths:
      - .cache/pnpm-store
      - .cache/npm
  before_script:
    - *install

# JDK 21 + Node + Android SDK, cached between pipelines.
.native:
  image: eclipse-temurin:21-jdk
  cache:
    key: capuchoo-native-$NODE_VERSION-$ANDROID_BUILD_TOOLS
    paths:
      - .cache/node
      - .cache/android-sdk
      - .cache/pnpm-store
      - .cache/npm
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl git unzip xz-utils > /dev/null
    - |
      NODE_DIR="$CI_PROJECT_DIR/.cache/node/node-v$NODE_VERSION-linux-x64"
      if [ ! -x "$NODE_DIR/bin/node" ]; then
        mkdir -p "$CI_PROJECT_DIR/.cache/node"
        curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz" \
          | tar -xJ -C "$CI_PROJECT_DIR/.cache/node"
      fi
      export PATH="$NODE_DIR/bin:$PATH"
    - |
      export ANDROID_HOME="$CI_PROJECT_DIR/.cache/android-sdk"
      SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      if [ ! -x "$SDKMANAGER" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -fsSL -o /tmp/cmdline-tools.zip \
          "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip"
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
      yes | "$SDKMANAGER" --licenses > /dev/null || true
      "$SDKMANAGER" --install "platform-tools" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" > /dev/null
    - *install

check:
  extends: .web
  stage: check
  rules:
    - *release-branches
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CAPUCHOO_API_KEY
      variables: { CAPUCHOO_CHANNEL: "prod" }
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CAPUCHOO_STAGING_BRANCH && $CAPUCHOO_API_KEY
      variables: { CAPUCHOO_CHANNEL: "staging" }
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CAPUCHOO_DEV_BRANCH && $CAPUCHOO_API_KEY
      variables: { CAPUCHOO_CHANNEL: "dev" }
  script:
    - cd "$APP_DIR"
    - capuchoo deploy ota --channel "$CAPUCHOO_CHANNEL" --dry-run --yes --json > "$CI_PROJECT_DIR/capuchoo-check.json"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - capuchoo-check.json
      - $APP_DIR/capuchoo-deploy.log

publish:ota:
  extends: .web
  stage: publish
  needs: [check]
  resource_group: capuchoo-$CAPUCHOO_CHANNEL
  environment:
    name: $CAPUCHOO_CHANNEL
  rules: *release-branches
  script:
    - cd "$APP_DIR"
    - capuchoo deploy ota --channel "$CAPUCHOO_CHANNEL" --note "${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA} $CI_COMMIT_TITLE" --yes --json > "$CI_PROJECT_DIR/capuchoo-ota.json"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - capuchoo-ota.json
      - $APP_DIR/capuchoo-deploy.log

publish:native:
  extends: .native
  stage: publish
  needs: [check]
  resource_group: capuchoo-$CAPUCHOO_CHANNEL
  environment:
    name: $CAPUCHOO_CHANNEL
  rules:
    - if: $CI_COMMIT_TAG
      variables: { CAPUCHOO_CHANNEL: "prod" }
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables: { CAPUCHOO_CHANNEL: "prod" }
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CAPUCHOO_STAGING_BRANCH
      variables: { CAPUCHOO_CHANNEL: "staging" }
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CAPUCHOO_DEV_BRANCH
      variables: { CAPUCHOO_CHANNEL: "dev" }
      when: manual
      allow_failure: true
  script:
    - cd "$APP_DIR"
    - |
      if [ ! -s "${ANDROID_KEYSTORE_BASE64:-}" ]; then
        echo "ANDROID_KEYSTORE_BASE64 is not set; a release APK cannot be signed." >&2
        exit 1
      fi
      base64 -d "$ANDROID_KEYSTORE_BASE64" > android/release.keystore
      printf 'RELEASE_STORE_FILE=%s\nRELEASE_STORE_PASSWORD=%s\nRELEASE_KEY_ALIAS=%s\nRELEASE_KEY_PASSWORD=%s\n' \
        "$PWD/android/release.keystore" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
        >> android/local.properties
      export CAPUCHOO_KEYSTORE_FILE=release.keystore
      export CAPUCHOO_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
      export CAPUCHOO_KEY_ALIAS="$ANDROID_KEY_ALIAS"
      export CAPUCHOO_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
      capuchoo deploy native --channel "$CAPUCHOO_CHANNEL" --type=release \
        --note "${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA} $CI_COMMIT_TITLE" --yes --json > "$CI_PROJECT_DIR/capuchoo-native.json"
  after_script:
    - rm -f "$APP_DIR/android/release.keystore"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - capuchoo-native.json
      - $APP_DIR/capuchoo-deploy.log

# Points a client channel at what prod already serves. Nothing is rebuilt. No `needs`: the job
# waits for the whole publish stage and receives the native result only when that job ran.
.deliver:
  image: $NODE_IMAGE
  stage: deliver
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: $CAPUCHOO_TARGET_CHANNEL
  script:
    - |
      VERSION=$(node -p "require(process.argv[1]).version" "$CI_PROJECT_DIR/capuchoo-ota.json")
      NATIVE_FLAG=""
      if [ -f "$CI_PROJECT_DIR/capuchoo-native.json" ]; then
        NATIVE_FLAG="--native=$(node -p "require(process.argv[1]).versionCode" "$CI_PROJECT_DIR/capuchoo-native.json")"
      fi
      cd "$APP_DIR"
      npx --yes "@capuchoo/cli@$CAPUCHOO_CLI_VERSION" channel point "$CAPUCHOO_TARGET_CHANNEL" \
        --version "$VERSION" $NATIVE_FLAG --reason "GitLab $CI_PIPELINE_URL" --yes --json

# capuchoo:deliver-jobs
