# Generated by `capuchoo ci init --gitlab`. Build once on the default branch or a tag, publish to
# prod, then deliver the same artefact to each client channel with a manual job.
#
# Settings > CI/CD > Variables, every one Protected (so only protected branches and tags see them):
#   CAPUCHOO_ENDPOINT          backend base URL
#   CAPUCHOO_API_KEY           API key scoped to this app                         Masked
#   CAPUCHOO_SIGNING_KEY       base64 PKCS#8 body of .capuchoo/signing-key.pem   Masked (optional)
#   ANDROID_KEYSTORE_BASE64    File variable: the release keystore, base64       Masked (native only)
#   ANDROID_KEYSTORE_PASSWORD  ANDROID_KEY_ALIAS  ANDROID_KEY_PASSWORD           Masked (native only)
#
# Set CAPUCHOO_DEPLOY_KIND to "native" to publish an APK instead of an OTA bundle. The keystore
# values are written to android/local.properties as RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD,
# RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD, and exported as CAPUCHOO_KEYSTORE_*; rename them to
# whatever your signingConfig reads.

stages:
  - check
  - publish
  - deliver

variables:
  APP_DIR: "."
  CAPUCHOO_DEPLOY_KIND: "ota"
  CAPUCHOO_CLI_VERSION: "__CAPUCHOO_CLI_VERSION__"
  NODE_VERSION: "22.12.0"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_CMDLINE_TOOLS: "11076708"

.release-refs: &release-refs
  - if: $CI_COMMIT_TAG
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Node 22 + pnpm (corepack) + JDK 21 + Android SDK, cached between pipelines.
.toolchain:
  image: eclipse-temurin:21-jdk
  cache:
    key: capuchoo-toolchain-$NODE_VERSION-$ANDROID_BUILD_TOOLS
    paths:
      - .cache/node
      - .cache/android-sdk
      - .cache/pnpm-store
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl git unzip xz-utils > /dev/null
    - |
      NODE_DIR="$CI_PROJECT_DIR/.cache/node/node-v$NODE_VERSION-linux-x64"
      if [ ! -x "$NODE_DIR/bin/node" ]; then
        mkdir -p "$CI_PROJECT_DIR/.cache/node"
        curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz" \
          | tar -xJ -C "$CI_PROJECT_DIR/.cache/node"
      fi
      export PATH="$NODE_DIR/bin:$PATH"
    - corepack enable
    - pnpm config set store-dir "$CI_PROJECT_DIR/.cache/pnpm-store"
    - |
      export ANDROID_HOME="$CI_PROJECT_DIR/.cache/android-sdk"
      SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      if [ ! -x "$SDKMANAGER" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -fsSL -o /tmp/cmdline-tools.zip \
          "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip"
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
      yes | "$SDKMANAGER" --licenses > /dev/null || true
      "$SDKMANAGER" --install "platform-tools" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" > /dev/null
    - pnpm install --frozen-lockfile

check:
  extends: .toolchain
  stage: check
  rules: *release-refs
  script:
    - cd "$APP_DIR"
    - pnpm exec capuchoo deploy ota --channel prod --dry-run --yes --json > "$CI_PROJECT_DIR/capuchoo-check.json"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - capuchoo-check.json
      - $APP_DIR/capuchoo-deploy.log

publish:prod:
  extends: .toolchain
  stage: publish
  needs: [check]
  resource_group: capuchoo-prod
  rules: *release-refs
  script:
    - cd "$APP_DIR"
    - |
      TYPE_FLAG=""
      if [ "$CAPUCHOO_DEPLOY_KIND" = "native" ]; then
        if [ ! -s "${ANDROID_KEYSTORE_BASE64:-}" ]; then
          echo "ANDROID_KEYSTORE_BASE64 is not set; a release APK cannot be signed." >&2
          exit 1
        fi
        base64 -d "$ANDROID_KEYSTORE_BASE64" > android/release.keystore
        printf 'RELEASE_STORE_FILE=%s\nRELEASE_STORE_PASSWORD=%s\nRELEASE_KEY_ALIAS=%s\nRELEASE_KEY_PASSWORD=%s\n' \
          "$PWD/android/release.keystore" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
          >> android/local.properties
        export CAPUCHOO_KEYSTORE_FILE=release.keystore
        export CAPUCHOO_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
        export CAPUCHOO_KEY_ALIAS="$ANDROID_KEY_ALIAS"
        export CAPUCHOO_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
        TYPE_FLAG="--type=release"
      fi
      pnpm exec capuchoo deploy "$CAPUCHOO_DEPLOY_KIND" --channel prod $TYPE_FLAG \
        --note "${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" --yes --json > "$CI_PROJECT_DIR/capuchoo-release.json"
  after_script:
    - rm -f "$APP_DIR/android/release.keystore"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - capuchoo-release.json
      - $APP_DIR/capuchoo-deploy.log

# Points a client channel at what publish:prod uploaded. Nothing is rebuilt.
.deliver:
  image: node:22
  stage: deliver
  needs:
    - job: "publish:prod"
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - corepack enable
    - |
      RELEASE="$CI_PROJECT_DIR/capuchoo-release.json"
      VERSION=$(node -p "require(process.argv[1]).version" "$RELEASE")
      NATIVE_FLAG=$(node -p "const r = require(process.argv[1]); r.kind === 'native' ? '--native=' + r.versionCode : ''" "$RELEASE")
      cd "$APP_DIR"
      pnpm dlx "@capuchoo/cli@$CAPUCHOO_CLI_VERSION" channel point "$CAPUCHOO_TARGET_CHANNEL" \
        --version "$VERSION" $NATIVE_FLAG --reason "GitLab $CI_PIPELINE_URL" --yes --json

# capuchoo:deliver-jobs
