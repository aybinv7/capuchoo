# Generated by `capuchoo ci init --gitlab`. A push to dev or staging publishes an OTA bundle to
# that channel as the next prerelease (0.1.11-dev.4), with no version commit. A tag publishes prod
# at the tag's version (v1.2.0 -> 1.2.0). Every other push to the default branch, and every merge
# request into a release branch, rehearses the deploy without uploading. Prod is then delivered to
# each client channel by hand, from the artefact prod already holds.
#
#   tag                        -> prod, at the tag's version
#   $CAPUCHOO_STAGING_BRANCH   -> staging, -v auto
#   $CAPUCHOO_DEV_BRANCH       -> dev, -v auto
#   default branch             -> rehearsal against prod
#
# A native APK is built only when asked for, by starting the manual publish:native job, so a
# web-only change never waits for Gradle.
#
# A pipeline started through the API with CAPUCHOO_ACTION set, which is how the Capuchoo dashboard
# starts one, runs what it asks for instead of what the ref implies. ota and native run check and
# then publish with no manual step; check only rehearses; deliver builds nothing and points
# prod-<client> at a version prod already serves.
#   CAPUCHOO_ACTION      ota, native, check or deliver
#   CAPUCHOO_CHANNEL     outranks the ref's channel; empty uses it, and the default branch is prod
#   CAPUCHOO_VERSION     auto or x.y.z; empty uses the tag, else auto. Prod is never published auto.
#   CAPUCHOO_CLIENT      deliver: one of CAPUCHOO_CLIENTS
#   CAPUCHOO_NOTES       release notes
#   CAPUCHOO_BUILD_TYPE  native: release (the default, needs the keystore) or debug
# A pipeline started through the API without CAPUCHOO_ACTION behaves like a push to its ref.
#
# Settings > CI/CD > Variables, every one Protected, and the three branches protected so they see
# them. A merge request rehearsal runs only where CAPUCHOO_API_KEY is visible to it.
#   CAPUCHOO_ENDPOINT          backend base URL
#   CAPUCHOO_API_KEY           API key scoped to this app                         Masked
#   CAPUCHOO_SIGNING_KEY       base64 PKCS#8 body of .capuchoo/signing-key.pem   Masked (optional)
#   ANDROID_KEYSTORE_BASE64    File variable: the release keystore, base64       Masked (native only)
#   ANDROID_KEYSTORE_PASSWORD  ANDROID_KEY_ALIAS  ANDROID_KEY_PASSWORD           Masked (native only)
#
# The keystore values are written to android/local.properties as RELEASE_STORE_FILE,
# RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD, and exported as
# CAPUCHOO_KEYSTORE_*; rename them to whatever your signingConfig reads.

stages:
  - check
  - publish
  - deliver

variables:
  APP_DIR: "."
  CAPUCHOO_CLI_VERSION: "__CAPUCHOO_CLI_VERSION__"
  CAPUCHOO_CLIENTS: "__CAPUCHOO_CLIENTS__"
  CAPUCHOO_DEV_BRANCH: "__CAPUCHOO_DEV_BRANCH__"
  CAPUCHOO_STAGING_BRANCH: "__CAPUCHOO_STAGING_BRANCH__"
  NODE_IMAGE: "node:22-bookworm"
  NODE_VERSION: "22.20.0"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_CMDLINE_TOOLS: "11076708"

.release-refs: &release-refs
  - if: $CI_COMMIT_TAG
    variables: { CAPUCHOO_CHANNEL: "prod" }
  - if: $CI_COMMIT_BRANCH == $CAPUCHOO_STAGING_BRANCH
    variables: { CAPUCHOO_CHANNEL: "staging" }
  - if: $CI_COMMIT_BRANCH == $CAPUCHOO_DEV_BRANCH
    variables: { CAPUCHOO_CHANNEL: "dev" }

# A pipeline started through the API with CAPUCHOO_ACTION. A CAPUCHOO_CHANNEL passed with it
# outranks the channel set here, so these only supply the one the ref implies. Each job puts its
# own `when: never` for the other actions first.
.api-refs: &api-refs
  - if: $CI_PIPELINE_SOURCE == "api" && $CAPUCHOO_ACTION && $CI_COMMIT_TAG
    variables: { CAPUCHOO_CHANNEL: "prod" }
  - if: $CI_PIPELINE_SOURCE == "api" && $CAPUCHOO_ACTION && $CI_COMMIT_BRANCH == $CAPUCHOO_STAGING_BRANCH
    variables: { CAPUCHOO_CHANNEL: "staging" }
  - if: $CI_PIPELINE_SOURCE == "api" && $CAPUCHOO_ACTION && $CI_COMMIT_BRANCH == $CAPUCHOO_DEV_BRANCH
    variables: { CAPUCHOO_CHANNEL: "dev" }
  - if: $CI_PIPELINE_SOURCE == "api" && $CAPUCHOO_ACTION && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    variables: { CAPUCHOO_CHANNEL: "prod" }
  - if: $CI_PIPELINE_SOURCE == "api" && $CAPUCHOO_ACTION

# Refuses an API pipeline whose variables do not describe a release, before anything is installed.
# Does nothing on any other pipeline.
.api-plan: &api-plan
  - |
    if [ "$CI_PIPELINE_SOURCE" = "api" ] && [ -n "${CAPUCHOO_ACTION:-}" ]; then
      matches() { [ "$(printf '%s' "$1" | wc -l)" -eq 0 ] && printf '%s\n' "$1" | grep -Eq "$2"; }
      VERSION="${CAPUCHOO_VERSION:-${CI_COMMIT_TAG:-auto}}"
      case "$CAPUCHOO_ACTION" in
        ota|native|check) ;;
        *) echo "Unknown CAPUCHOO_ACTION $CAPUCHOO_ACTION: use ota, native, check or deliver." >&2; exit 1 ;;
      esac
      if [ -z "${CAPUCHOO_CHANNEL:-}" ]; then
        echo "$CI_COMMIT_REF_NAME is not a release branch; start the pipeline with CAPUCHOO_CHANNEL." >&2
        exit 1
      fi
      if ! matches "$CAPUCHOO_CHANNEL" '^[a-z0-9][a-z0-9-]{0,62}$'; then
        echo "CAPUCHOO_CHANNEL $CAPUCHOO_CHANNEL is not a channel name." >&2
        exit 1
      fi
      if ! matches "$VERSION" '^(auto|v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$'; then
        echo "Version $VERSION is neither auto nor x.y.z; pass CAPUCHOO_VERSION." >&2
        exit 1
      fi
      if [ "$CAPUCHOO_ACTION" != "check" ] && [ "$CAPUCHOO_CHANNEL" = "prod" ] && [ "$VERSION" = "auto" ]; then
        echo "Prod is published from a tag or an exact version, never -v auto. Pass CAPUCHOO_VERSION." >&2
        exit 1
      fi
      case "${CAPUCHOO_BUILD_TYPE:-release}" in
        release|debug) ;;
        *) echo "CAPUCHOO_BUILD_TYPE must be release or debug, not $CAPUCHOO_BUILD_TYPE." >&2; exit 1 ;;
      esac
    fi

# Installs with whatever the lockfile says, at the version package.json pins, then puts the
# project's own capuchoo on PATH.
.install: &install
  - |
    PM_VERSION=$(node -p "const p = require('./package.json'); (p.packageManager || '').split('@')[1]?.split('+')[0] || p.devEngines?.packageManager?.version || 'latest'")
    if [ -f pnpm-lock.yaml ]; then
      npm install -g --silent "pnpm@$PM_VERSION"
      pnpm config set store-dir "$CI_PROJECT_DIR/.cache/pnpm-store"
      pnpm install --frozen-lockfile
    elif [ -f yarn.lock ]; then
      corepack enable
      yarn install --immutable
    elif [ -f bun.lock ] || [ -f bun.lockb ]; then
      npm install -g --silent bun
      bun install --frozen-lockfile
    else
      npm ci --cache "$CI_PROJECT_DIR/.cache/npm"
    fi
  - export PATH="$CI_PROJECT_DIR/$APP_DIR/node_modules/.bin:$CI_PROJECT_DIR/node_modules/.bin:$PATH"

# Node only: an OTA deploy builds the web app and syncs Capacitor, and needs no Android SDK.
.web:
  image: $NODE_IMAGE
  cache:
    key: capuchoo-web-$NODE_IMAGE
    paths:
      - .cache/pnpm-store
      - .cache/npm
  before_script:
    - *api-plan
    - *install

# JDK 21 + Node + Android SDK, cached between pipelines.
.native:
  image: eclipse-temurin:21-jdk
  cache:
    key: capuchoo-native-$NODE_VERSION-$ANDROID_BUILD_TOOLS
    paths:
      - .cache/node
      - .cache/android-sdk
      - .cache/pnpm-store
      - .cache/npm
  before_script:
    - *api-plan
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl git unzip xz-utils > /dev/null
    - |
      NODE_DIR="$CI_PROJECT_DIR/.cache/node/node-v$NODE_VERSION-linux-x64"
      if [ ! -x "$NODE_DIR/bin/node" ]; then
        mkdir -p "$CI_PROJECT_DIR/.cache/node"
        curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz" \
          | tar -xJ -C "$CI_PROJECT_DIR/.cache/node"
      fi
      export PATH="$NODE_DIR/bin:$PATH"
    - |
      export ANDROID_HOME="$CI_PROJECT_DIR/.cache/android-sdk"
      SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      if [ ! -x "$SDKMANAGER" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -fsSL -o /tmp/cmdline-tools.zip \
          "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip"
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
      yes | "$SDKMANAGER" --licenses > /dev/null || true
      "$SDKMANAGER" --install "platform-tools" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" > /dev/null
    - *install

check:
  extends: .web
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "api" && $CAPUCHOO_ACTION == "deliver"
      when: never
    - *api-refs
    - *release-refs
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables: { CAPUCHOO_CHANNEL: "prod" }
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CAPUCHOO_API_KEY
      variables: { CAPUCHOO_CHANNEL: "prod" }
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CAPUCHOO_STAGING_BRANCH && $CAPUCHOO_API_KEY
      variables: { CAPUCHOO_CHANNEL: "staging" }
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CAPUCHOO_DEV_BRANCH && $CAPUCHOO_API_KEY
      variables: { CAPUCHOO_CHANNEL: "dev" }
  script:
    - cd "$APP_DIR"
    - capuchoo deploy ota --channel "$CAPUCHOO_CHANNEL" -v "${CAPUCHOO_VERSION:-${CI_COMMIT_TAG:-auto}}" --dry-run --yes --json > "$CI_PROJECT_DIR/capuchoo-check.json"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - capuchoo-check.json
      - $APP_DIR/capuchoo-deploy.log

publish:ota:
  extends: .web
  stage: publish
  needs: [check]
  resource_group: capuchoo-$CAPUCHOO_CHANNEL
  environment:
    name: $CAPUCHOO_CHANNEL
  rules:
    - if: $CI_PIPELINE_SOURCE == "api" && $CAPUCHOO_ACTION && $CAPUCHOO_ACTION != "ota"
      when: never
    - *api-refs
    - *release-refs
  script:
    - cd "$APP_DIR"
    - capuchoo deploy ota --channel "$CAPUCHOO_CHANNEL" -v "${CAPUCHOO_VERSION:-${CI_COMMIT_TAG:-auto}}" --note "${CAPUCHOO_NOTES:-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA} $CI_COMMIT_TITLE}" --yes --json > "$CI_PROJECT_DIR/capuchoo-ota.json"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - capuchoo-ota.json
      - $APP_DIR/capuchoo-deploy.log

publish:native:
  extends: .native
  stage: publish
  needs: [check]
  resource_group: capuchoo-$CAPUCHOO_CHANNEL
  environment:
    name: $CAPUCHOO_CHANNEL
  rules:
    - if: $CI_PIPELINE_SOURCE == "api" && $CAPUCHOO_ACTION && $CAPUCHOO_ACTION != "native"
      when: never
    - *api-refs
    - if: $CI_COMMIT_TAG
      variables: { CAPUCHOO_CHANNEL: "prod" }
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CAPUCHOO_STAGING_BRANCH
      variables: { CAPUCHOO_CHANNEL: "staging" }
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CAPUCHOO_DEV_BRANCH
      variables: { CAPUCHOO_CHANNEL: "dev" }
      when: manual
      allow_failure: true
  script:
    - cd "$APP_DIR"
    - |
      BUILD_TYPE="${CAPUCHOO_BUILD_TYPE:-release}"
      if [ "$BUILD_TYPE" = "release" ]; then
        if [ ! -s "${ANDROID_KEYSTORE_BASE64:-}" ]; then
          echo "ANDROID_KEYSTORE_BASE64 is not set; a release APK cannot be signed." >&2
          exit 1
        fi
        base64 -d "$ANDROID_KEYSTORE_BASE64" > android/release.keystore
        printf 'RELEASE_STORE_FILE=%s\nRELEASE_STORE_PASSWORD=%s\nRELEASE_KEY_ALIAS=%s\nRELEASE_KEY_PASSWORD=%s\n' \
          "$PWD/android/release.keystore" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
          >> android/local.properties
        export CAPUCHOO_KEYSTORE_FILE=release.keystore
        export CAPUCHOO_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
        export CAPUCHOO_KEY_ALIAS="$ANDROID_KEY_ALIAS"
        export CAPUCHOO_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
      fi
      capuchoo deploy native --channel "$CAPUCHOO_CHANNEL" --type="$BUILD_TYPE" -v "${CAPUCHOO_VERSION:-${CI_COMMIT_TAG:-auto}}" \
        --note "${CAPUCHOO_NOTES:-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA} $CI_COMMIT_TITLE}" --yes --json > "$CI_PROJECT_DIR/capuchoo-native.json"
  after_script:
    - rm -f "$APP_DIR/android/release.keystore"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - capuchoo-native.json
      - $APP_DIR/capuchoo-deploy.log

# Points a client channel at what prod already serves. Nothing is rebuilt. No `needs`: the job
# waits for the whole publish stage and receives the native result only when that job ran.
.deliver:
  image: $NODE_IMAGE
  stage: deliver
  rules:
    - if: $CI_PIPELINE_SOURCE == "api" && $CAPUCHOO_ACTION && $CAPUCHOO_ACTION != "ota"
      when: never
    - if: $CI_COMMIT_TAG
      when: manual
  environment:
    name: $CAPUCHOO_TARGET_CHANNEL
  script:
    - |
      VERSION=$(node -p "require(process.argv[1]).version" "$CI_PROJECT_DIR/capuchoo-ota.json")
      NATIVE_FLAG=""
      if [ -f "$CI_PROJECT_DIR/capuchoo-native.json" ]; then
        CODE=$(node -p "const r = require(process.argv[1]); r.ok ? r.versionCode : ''" "$CI_PROJECT_DIR/capuchoo-native.json")
        if [ -n "$CODE" ]; then NATIVE_FLAG="--native=$CODE"; fi
      fi
      cd "$APP_DIR"
      npx --yes "@capuchoo/cli@$CAPUCHOO_CLI_VERSION" channel point "$CAPUCHOO_TARGET_CHANNEL" \
        --version "$VERSION" $NATIVE_FLAG --reason "GitLab $CI_PIPELINE_URL" --yes --json

# An API pipeline with CAPUCHOO_ACTION=deliver: points prod-$CAPUCHOO_CLIENT at CAPUCHOO_VERSION,
# which prod must already have served. Nothing is built.
deliver:api:
  image: $NODE_IMAGE
  stage: deliver
  needs: []
  resource_group: capuchoo-prod-$CAPUCHOO_CLIENT
  environment:
    name: prod-$CAPUCHOO_CLIENT
  rules:
    - if: $CI_PIPELINE_SOURCE == "api" && $CAPUCHOO_ACTION == "deliver"
  script:
    - |
      matches() { [ "$(printf '%s' "$1" | wc -l)" -eq 0 ] && printf '%s\n' "$1" | grep -Eq "$2"; }
      CLIENT="${CAPUCHOO_CLIENT:-}"
      VERSION="${CAPUCHOO_VERSION:-}"
      if [ -z "$CLIENT" ] || ! matches "$CLIENT" '^[a-z0-9][a-z0-9-]{0,62}$'; then
        echo "deliver needs CAPUCHOO_CLIENT, the client whose prod-<client> channel is pointed." >&2
        exit 1
      fi
      case " $CAPUCHOO_CLIENTS " in
        *" $CLIENT "*) ;;
        *) echo "$CLIENT is not one of the clients this pipeline was generated for (${CAPUCHOO_CLIENTS:-none}); re-run capuchoo ci init --gitlab --clients." >&2; exit 1 ;;
      esac
      if [ -z "$VERSION" ] || [ "$VERSION" = "auto" ]; then
        echo "deliver needs CAPUCHOO_VERSION, the exact version prod serves." >&2
        exit 1
      fi
      if ! matches "$VERSION" '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
        echo "CAPUCHOO_VERSION $VERSION is not an x.y.z version." >&2
        exit 1
      fi
      cd "$APP_DIR"
      npx --yes "@capuchoo/cli@$CAPUCHOO_CLI_VERSION" channel point "prod-$CLIENT" \
        --version "${VERSION#v}" --reason "GitLab $CI_PIPELINE_URL" --yes --json

# capuchoo:deliver-jobs
